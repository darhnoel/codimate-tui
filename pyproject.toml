[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "codimate-tui"
version = "0.1.0"
description = "Explain an algorithm as an animation that plays in the terminal."
requires-python = ">=3.9"

[tool.maturin]
manifest-path = "crates/codimate-tui-py/Cargo.toml"
python-source = "python"
module-name = "codimate_tui._codimate_tui"
features = ["extension-module"]
